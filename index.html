<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keystone">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Keystone</title>
</head>
<body>
  <div id="app">
    <section id="view-today" class="view active"></section>
    <section id="view-month" class="view"></section>
    <section id="view-history" class="view"></section>
    <section id="view-settings" class="view"></section>
    <nav class="tab-bar">
      <button class="tab active" data-view="today">Today</button>
      <button class="tab" data-view="month">Month</button>
      <button class="tab" data-view="history">History</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </div>
  <script src="streak.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
